plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '26.3-1.0.4'
group = 'com.milamber_brass.brass_armory'
base.archivesName = 'brass_armory'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.101'
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            programArguments.addAll '--username', 'Dev1'
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
        data {
            clientData()
            gameDirectory = file('run/data')
            programArguments.addAll '--mod', 'brass_armory', '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods {
        brass_armory { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}
repositories {
    maven { url = 'https://maven.blamejared.com/' }
}
dependencies {
    compileOnly 'mezz.jei:jei-26.3-neoforge:31.17.0.109'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
jar {
    manifest {
        attributes([
            'Specification-Title': 'brass_armory',
            'Specification-Vendor': 'brass_armorysareus',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'brass_armorysareus'
        ])
    }
}
